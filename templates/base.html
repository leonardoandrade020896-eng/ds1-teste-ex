<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título dinâmico que pode ser alterado por cada página -->
    <title>{% block title %}Meu Sistema{% endblock %}</title>
    <!-- Importação centralizada do CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <!-- Componente Fixo da Barra de Navegação -->
      {% include 'components/navbar.html' %}

      <!-- BLOCO DE FLASH MESSAGES (Alertas e Notificações do Sistema) -->
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %} {% endwith %}

      <!-- BLOCO DINÂMICO: Onde o conteúdo das outras páginas (index, cadastro) será inserido -->
      {% block content %} {% endblock %}
    </div>
  </body>
</html>
