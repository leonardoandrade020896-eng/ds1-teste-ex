<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Novo cadastro</h2>
        <form action="/salvar" method="post">
            <label for="campo_nome">Nome Principal</label>
            <input type="text" id="campo_nome" name="campo_nome" required>

            <label for="campo_info">Informações:</label>
            <input type="text" id="campo_info" name="campo_info" required>

            <label>Valor</label>
            <input type="number" step="0.01" name="campo_valor" placeholder="0.00" required>

            <button type="submit">Salvar</button>
        </form>

        <hr>
        <a href="/">Voltar para a página anterior</a>
    </div>
</body>
</html>
